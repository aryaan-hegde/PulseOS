[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200
extra_scripts = pre:.vscode/install-hooks.py

; IMU-only test build: same board, but uses src/imu_test.c as the program
; instead of main.c. Build/upload with:  pio run -e imu_test -t upload
[env:imu_test]
extends = env:proton
build_src_filter = +<*> -<main.c>
build_flags =
    -D IMU_TEST
    ; -D IMU_USE_BUILTIN_CLASSIFIER=1   ; uncomment to also use the BNO085's own step counter / activity classifier

; RTC-only test build: prints the time to the serial monitor and accepts a
; "set YYYY-MM-DD HH:MM:SS" command. Build/upload with:  pio run -e rtc_test -t upload
[env:rtc_test]
extends = env:proton
build_src_filter = +<*> -<main.c>
build_flags =
    -D RTC_TEST
    ; -D RTC_SET_FROM_BUILD_TIME=0   ; uncomment to only ever set the time with the "set" command

[env:heartrate_test]
extends = env:proton
build_flags =
    ${env:proton.build_flags}
    -DHEARTRATE_TEST
build_src_filter =
    -<*>
    +<i2c_bus.c>
    +<heartrate.c>
    +<heartrate_test.c>
    
[platformio]
default_envs = proton
